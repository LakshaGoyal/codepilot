<text x="476" y="218" fill="#f4f1ff" font-size="14" font-weight="600">Group "ship-it"</text><text x="476" y="236" fill="#b9b3d0" font-size="12">private, 3 members</text>
<rect x="460" y="262" width="240" height="52" rx="12" fill="#8f74ff" fill-opacity=".16" stroke="#8f74ff"/>
<text x="476" y="284" fill="#f4f1ff" font-size="14" font-weight="600">REST API</text><text x="476" y="302" fill="#b9b3d0" font-size="12">send as the agent, list messages</text>
