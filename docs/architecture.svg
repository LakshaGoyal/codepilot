<rect width="1160" height="690" rx="22" fill="#0d0b14"/><rect width="1160" height="690" rx="22" fill="url(#g1)"/><rect width="1160" height="690" rx="22" fill="url(#g2)"/><rect width="1160" height="690" rx="22" fill="url(#g3)"/>
<text x="34" y="44" fill="#f4f1ff" font-size="22" font-weight="700">Agent Pager</text>
<text x="34" y="68" fill="#a59fbf" font-size="14">how a chat message becomes a reviewed commit</text>
