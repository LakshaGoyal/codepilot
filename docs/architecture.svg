<path d="M980 512 V 565 H 180 V 516" fill="none" stroke="#c6f24e" stroke-width="2.2" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#m-lime)"/>
<text x="580" y="558" fill="#c6f24e" font-size="12" font-weight="600" text-anchor="middle">file change → live preview reloads</text>
<circle cx="48" cy="624" r="14" fill="#ff6b4a"/><text x="48" y="629" text-anchor="middle" font-size="14" font-weight="800" fill="#0d0b14">1</text>
<text x="70" y="629" fill="#e6e1f5" font-size="13">You message @Pager</text>
<circle cx="274" cy="624" r="14" fill="#4ad6ff"/><text x="274" y="629" text-anchor="middle" font-size="14" font-weight="800" fill="#0d0b14">2</text>
<text x="296" y="629" fill="#e6e1f5" font-size="13">Server sees it, checks allowlist</text>
<circle cx="500" cy="624" r="14" fill="#c6f24e"/><text x="500" y="629" text-anchor="middle" font-size="14" font-weight="800" fill="#0d0b14">3</text>
<text x="522" y="629" fill="#e6e1f5" font-size="13">Claude edits the repo, tests run</text>
<circle cx="726" cy="624" r="14" fill="#8f74ff"/><text x="726" y="629" text-anchor="middle" font-size="14" font-weight="800" fill="#0d0b14">4</text>
<text x="748" y="629" fill="#e6e1f5" font-size="13">Result card lands in the chat</text>
<circle cx="952" cy="624" r="14" fill="#ff6b4a"/><text x="952" y="629" text-anchor="middle" font-size="14" font-weight="800" fill="#0d0b14">5</text>
<text x="974" y="629" fill="#e6e1f5" font-size="13">Teammate taps Ship it</text>
<text x="34" y="668" fill="#8d87a6" font-size="12">Nothing is committed until a human approves. Claude only touches workspace/. git push, rm and web access are blocked.</text>
