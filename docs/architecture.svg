<text x="876" y="152" fill="#f4f1ff" font-size="14" font-weight="600">Express server</text><text x="876" y="170" fill="#b9b3d0" font-size="12">/api/token, /api/status, /preview</text>
<rect x="860" y="196" width="240" height="52" rx="12" fill="#4ad6ff" fill-opacity=".16" stroke="#4ad6ff"/>
<text x="876" y="218" fill="#f4f1ff" font-size="14" font-weight="600">Allowlist</text><text x="876" y="236" fill="#b9b3d0" font-size="12">only Hridya and Sam can give orders</text>
<rect x="860" y="262" width="240" height="52" rx="12" fill="#4ad6ff" fill-opacity=".16" stroke="#4ad6ff"/>
<text x="876" y="284" fill="#f4f1ff" font-size="14" font-weight="600">brain.js</text><text x="876" y="302" fill="#b9b3d0" font-size="12">poll · route · throttle status</text>
<rect x="860" y="328" width="240" height="52" rx="12" fill="#4ad6ff" fill-opacity=".16" stroke="#4ad6ff"/>
<text x="876" y="350" fill="#f4f1ff" font-size="14" font-weight="600">agent.js</text><text x="876" y="368" fill="#b9b3d0" font-size="12">spawns claude -p, reads its steps</text>
<rect x="860" y="394" width="240" height="52" rx="12" fill="#c6f24e" fill-opacity=".16" stroke="#c6f24e"/>
<text x="876" y="416" fill="#f4f1ff" font-size="14" font-weight="600">Claude Code</text><text x="876" y="434" fill="#b9b3d0" font-size="12">cwd = workspace/, limited tools</text>
<rect x="860" y="460" width="240" height="52" rx="12" fill="#c6f24e" fill-opacity=".16" stroke="#c6f24e"/>
<text x="876" y="482" fill="#f4f1ff" font-size="14" font-weight="600">workspace/</text><text x="876" y="500" fill="#b9b3d0" font-size="12">demo app · git history · npm test</text>
<line x1="300" y1="222" x2="460" y2="222" stroke="#8f74ff" stroke-width="2.2" marker-end="url(#m-violet)" marker-start="url(#m-violet)"/>
<text x="380" y="199" fill="#8f74ff" font-size="12" font-weight="600" text-anchor="middle">realtime</text>
<text x="380" y="212" fill="#b9b3d0" font-size="11" text-anchor="middle">messages, typing, reactions</text>
<line x1="860" y1="156" x2="700" y2="156" stroke="#4ad6ff" stroke-width="2.2" marker-end="url(#m-sky)"/>
<text x="780" y="133" fill="#4ad6ff" font-size="12" font-weight="600" text-anchor="middle">mint auth token</text>
<text x="780" y="146" fill="#b9b3d0" font-size="11" text-anchor="middle">key stays server-side</text>
<line x1="700" y1="288" x2="860" y2="288" stroke="#4ad6ff" stroke-width="2.2" marker-end="url(#m-sky)" marker-start="url(#m-sky)"/>
<text x="780" y="263" fill="#4ad6ff" font-size="12" font-weight="600" text-anchor="middle">poll + send as agent</text>
<text x="780" y="276" fill="#b9b3d0" font-size="11" text-anchor="middle">every 1.5 s, REST</text>
<line x1="980" y1="182" x2="980" y2="196" stroke="#4ad6ff" stroke-width="2.2" marker-end="url(#m-sky)"/>
<line x1="980" y1="248" x2="980" y2="262" stroke="#4ad6ff" stroke-width="2.2" marker-end="url(#m-sky)"/>
<line x1="980" y1="314" x2="980" y2="328" stroke="#4ad6ff" stroke-width="2.2" marker-end="url(#m-sky)"/>
<line x1="980" y1="380" x2="980" y2="394" stroke="#c6f24e" stroke-width="2.2" marker-end="url(#m-lime)"/>
